<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="12" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6" opacity="0.5" />
  
  <!-- Minibus Body Silhouette -->
  <g transform="translate(0, 10)">
    <!-- Main Body Shape -->
    <path d="M 120 280 C 120 180, 150 140, 256 140 C 362 140, 392 180, 392 280 L 392 340 C 392 355, 380 365, 365 365 L 147 365 C 132 365, 120 355, 120 340 Z" fill="url(#busGrad)" stroke="#0f172a" stroke-width="8" />

    <!-- Front Windshield Window -->
    <path d="M 145 235 C 148 180, 175 160, 256 160 C 337 160, 364 180, 367 235 Z" fill="#1e293b" stroke="#0f172a" stroke-width="6" />
    <path d="M 251 162 L 251 235" stroke="#94a3b8" stroke-width="4" />
    <!-- Glass Reflection -->
    <path d="M 160 220 L 220 170 L 235 170 L 175 220 Z" fill="#ffffff" opacity="0.15" />
    <path d="M 270 220 L 330 170 L 345 170 L 285 220 Z" fill="#ffffff" opacity="0.15" />

    <!-- Center Line / Stripe -->
    <path d="M 120 265 L 392 265 L 392 285 L 120 285 Z" fill="url(#accentGrad)" />

    <!-- Grille & Air Vents -->
    <rect x="180" y="300" width="152" height="30" rx="6" fill="#334155" stroke="#0f172a" stroke-width="4" />
    <line x1="200" y1="315" x2="312" y2="315" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="307" x2="312" y2="307" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="200" y1="323" x2="312" y2="323" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Headlights -->
    <circle cx="152" cy="315" r="18" fill="#fef08a" stroke="#0f172a" stroke-width="5" />
    <circle cx="152" cy="315" r="12" fill="#ffffff" />
    <circle cx="360" cy="315" r="18" fill="#fef08a" stroke="#0f172a" stroke-width="5" />
    <circle cx="360" cy="315" r="12" fill="#ffffff" />

    <!-- Bumper -->
    <rect x="130" y="340" width="252" height="20" rx="8" fill="#0f172a" />
    <rect x="230" y="346" width="52" height="10" rx="3" fill="#cbd5e1" />

    <!-- Side Mirrors -->
    <rect x="95" y="210" width="22" height="40" rx="6" fill="#0f172a" />
    <line x1="117" y1="230" x2="145" y2="230" stroke="#0f172a" stroke-width="6" />
    <rect x="395" y="210" width="22" height="40" rx="6" fill="#0f172a" />
    <line x1="395" y1="230" x2="367" y2="230" stroke="#0f172a" stroke-width="6" />

    <!-- Wheels / Tires -->
    <rect x="145" y="360" width="40" height="24" rx="8" fill="#0f172a" />
    <rect x="327" y="360" width="40" height="24" rx="8" fill="#0f172a" />
  </g>
</svg>